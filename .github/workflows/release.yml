name: Release
on:
  # to allow the manual trigger workflows
  workflow_dispatch:
    inputs:
        publishSnapshot:
          description: 'Publish Snapshot'
          required: true
          default: 'false'
  push:
    branches:
      - series/1.x # CE3
    tags:
      - "v1.*"

jobs:
  build:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v1') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publishSnapshot == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2.3.2
        with:
          fetch-depth: 0 # fetch all branches & tags

      - name: "Install Nix ❄️"
        uses: cachix/install-nix-action@v22

      - name: "Install Cachix ❄️"
        uses: cachix/cachix-action@v12
        with:
          name: redis4cats
          signingKey: "${{ secrets.CACHIX_SIGNING_KEY }}"

      - name: "Publish ${{ github.ref }} 🚀"
        env:
          PGP_PASSPHRASE: "${{ secrets.PGP_PASSPHRASE }}"
          PGP_SECRET: "${{ secrets.PGP_SECRET }}"
          SONATYPE_PASSWORD: "${{ secrets.SONATYPE_PASSWORD }}"
          SONATYPE_USERNAME: "${{ secrets.SONATYPE_USERNAME }}"
        run: nix develop -c sbt 'ci-release'
